spring:
  application:
    name: sanctions-screening
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Database Configuration
spring.datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/sanctions}
  username: ${DB_USERNAME:sanctions}
  password: ${DB_PASSWORD:sanctions}
  driver-class-name: org.postgresql.Driver
  hikari:
    connection-timeout: 30000
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 600000
    max-lifetime: 1800000

spring.jpa:
  hibernate:
    ddl-auto: validate
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: true
  show-sql: ${JPA_SHOW_SQL:false}

spring.flyway:
  enabled: true
  baseline-on-migrate: true
  locations: classpath:db/migration
  validate-on-migrate: true

# Security
spring.security:
  user:
    name: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    roles: ADMIN

# Ollama Configuration
ollama:
  enabled: ${OLLAMA_ENABLED:true}
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen3:4b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  max-retries: ${OLLAMA_MAX_RETRIES:3}

# UN Sanctions XML Configuration
sanctions:
  xml:
    source-url: ${SANCTIONS_XML_URL:https://www.un.org/securitycouncil/content/un-sc-consolidated-list-xml}
    download-timeout-seconds: ${SANCTIONS_DOWNLOAD_TIMEOUT:300}
    sync-interval-hours: ${SANCTIONS_SYNC_INTERVAL:24}
    max-records-per-import: ${SANCTIONS_MAX_RECORDS:10000}

# Search Configuration
search:
  candidate-limit: ${SEARCH_CANDIDATE_LIMIT:50}
  similarity-threshold: ${SEARCH_SIMILARITY_THRESHOLD:60}
  min-score-filter: ${SEARCH_MIN_SCORE_FILTER:0}
  max-ai-candidates: ${SEARCH_MAX_AI_CANDIDATES:10}

# Rate Limiting
resilience4j.ratelimiter:
  configs:
    default:
      limit-for-period: 100
      limit-refresh-period: 1m
      timeout-duration: 0

# Cache Configuration
spring.cache:
  type: caffeine
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=10m

# Logging
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.sanctions.screening: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: WARN
    org.hibernate: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sanctions-postgres
    environment:
      POSTGRES_DB: sanctions
      POSTGRES_USER: sanctions
      POSTGRES_PASSWORD: sanctions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanctions -d sanctions"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sanctions-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanctions-backend
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/sanctions
      - DB_USERNAME=sanctions
      - DB_PASSWORD=sanctions
      - SPRING_PROFILES_ACTIVE=prod
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_ENABLED=true
      - OLLAMA_MODEL=qwen3:4b
      - OLLAMA_TIMEOUT_SECONDS=120
      - SANCTIONS_XML_URL=https://www.un.org/securitycouncil/content/un-sc-consolidated-list-xml
      - SANCTIONS_DOWNLOAD_TIMEOUT=300
      - SANCTIONS_SYNC_INTERVAL=24
      - SEARCH_CANDIDATE_LIMIT=50
      - SEARCH_SIMILARITY_THRESHOLD=60
      - SEARCH_MIN_SCORE_FILTER=0
      - SEARCH_MAX_AI_CANDIDATES=10
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - JPA_SHOW_SQL=false
      - LOG_LEVEL=INFO
      - APP_LOG_LEVEL=DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sanctions-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api
    container_name: sanctions-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sanctions-network

  # Ollama (Optional - can run on host instead)
  ollama:
    image: ollama/ollama:latest
    container_name: sanctions-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - sanctions-network
    # Note: Ollama requires GPU access for best performance
    # For production, consider running Ollama on the host machine

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  sanctions-network:
    driver: bridge
